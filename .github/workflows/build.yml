name: Build Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. تنزيل الكود
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة جافا
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. إعداد بيئة نود
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 4. تجهيز مجلد ملفات الويب
        run: |
          mkdir -p www
          cp index.html www/

      - name: 5. تهيئة وبناء مشروع الأندرويد
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init "BoulaqiApp" "com.boulaqi.app" --web-dir www
          npx cap add android

          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

          # حقن الصلاحيات الرسمية للأندرويد
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

          # تفعيل تسريع الرسوميات GPU
          sed -i 's/<application/<application android:hardwareAccelerated="true"/g' android/app/src/main/AndroidManifest.xml

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. استخراج وتجهيز ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Boulaqi-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
